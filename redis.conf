# ─── PyTaskQ Redis persistence ────────────────────────────────────────────────
# AOF (Append Only File): every write command is appended to a log on disk.
# On restart Redis replays the log — queued tasks and results SURVIVE a crash.
appendonly yes

# fsync policy — how often the OS flushes the AOF to disk:
#   always    → zero data loss, but every write pays a disk round-trip (slow)
#   everysec  → at most ~1 second of writes lost on a crash (recommended)
#   no        → fastest, but loss window = whatever the OS decides (unsafe)
appendfsync everysec

# If the AOF file is truncated by a crash mid-write, still load what we can
# instead of refusing to start (last-1s of data is lost either way).
aof-load-truncated yes

# Rewrite the AOF in the background when it grows to 100% over the last
# rewrite — keeps disk usage bounded for long-lived queues.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── RDB snapshots (secondary safety net) ─────────────────────────────────────
# Point-in-time binary dumps; cheaper than AOF replay for cold starts.
save 900 1
save 300 10
save 60 10000

# ─── Memory ───────────────────────────────────────────────────────────────────
# Keep this below the container's memory limit (docker-compose.yml: 512M), so
# Redis refuses new writes instead of being killed by the OOM killer.
maxmemory 400mb
# noeviction: when full, Redis refuses NEW jobs (the API answers 503) and keeps
# every existing one. Any other policy makes Redis silently delete keys to make
# room: whole queues, job records, sessions, even accounts. PyTaskQ warns at
# startup and in Settings → Performance if this isn't noeviction.
maxmemory-policy noeviction

# ─── Durability trade-off ─────────────────────────────────────────────────────
# AOF everysec means a crash of the Redis machine can lose the last ~1 second
# of writes: jobs accepted in that second can disappear, and a job's finished
# status can be lost so that it runs again. An Idempotency-Key does NOT protect
# against this (the key is in the same lost second). If losing that second is
# unacceptable, use `appendfsync always` (slower writes).

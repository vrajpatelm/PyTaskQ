# ─── PyTaskQ Redis persistence ────────────────────────────────────────────────
# AOF (Append Only File): every write command is appended to a log on disk.
# On restart Redis replays the log — queued tasks and results SURVIVE a crash.
appendonly yes

# fsync policy — how often the OS flushes the AOF to disk:
#   always    → zero data loss, but every write pays a disk round-trip (slow)
#   everysec  → at most ~1 second of writes lost on a crash (recommended)
#   no        → fastest, but loss window = whatever the OS decides (unsafe)
appendfsync everysec

# If the AOF file is truncated by a crash mid-write, still load what we can
# instead of refusing to start (last-1s of data is lost either way).
aof-load-truncated yes

# Rewrite the AOF in the background when it grows to 100% over the last
# rewrite — keeps disk usage bounded for long-lived queues.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── RDB snapshots (secondary safety net) ─────────────────────────────────────
# Point-in-time binary dumps; cheaper than AOF replay for cold starts.
save 900 1
save 300 10
save 60 10000

# Durability trade-off note (interview soundbite):
# AOF everysec means a crash can lose the last ~1s of accepted tasks.
# PyTaskQ's client idempotency keys make a re-submission after that window
# deduplicate, so the realistic worst case is "client retries and gets the
# same task_id", not "double execution".

[pytest]
# Tell pytest-asyncio to automatically treat async test functions as asyncio tests
# Without this, you'd need @pytest.mark.asyncio on every single async test
asyncio_mode = auto

# Show verbose output so you can see each test name pass/fail
addopts = -v --tb=short

# Tell pytest where to look for tests
testpaths = tests

# Add src to pythonpath so tests can import modules from src/
pythonpath = src

# Default asyncio fixture scope
asyncio_default_fixture_loop_scope = function

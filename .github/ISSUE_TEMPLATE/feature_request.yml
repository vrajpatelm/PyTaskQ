name: Feature request
description: Something PyTaskQ should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution. What happens today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: others
    attributes:
      label: How do Celery, BullMQ or others handle it? (optional)

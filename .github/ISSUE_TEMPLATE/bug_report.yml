name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest task code and steps that show it.
      render: python
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Worker or dashboard log lines
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PyTaskQ, Python, Redis, redis-py and OS, e.g. "0.6.0, 3.12, Redis 7.2, redis-py 5.2, Ubuntu 24.04"
    validations: { required: true }
  - type: dropdown
    id: deploy
    attributes:
      label: How is it running?
      options: [Docker (deploy/), Docker (own setup), pip on a server, Local development]

# Runs on every push to main and on every pull request.
# Independent jobs, so one failure doesn't hide the others:
#   tests     – the pytest suite on the oldest and newest supported Pythons, with a coverage floor
#   other-os  – the suite on Windows (required) and macOS (experimental)
#   typecheck – mypy over the package
#   lint      – ruff, limited to rules that catch real bugs (not style)
#   dashboard – lints and builds the React dashboard, and checks that the
#               bundle committed in pytaskq/static matches the source
#   package   – builds the wheel, installs it in a clean environment and
#               checks the CLI and bundled dashboard work
#   docker    – builds the Docker image and runs it end to end (Redis +
#               dashboard + worker, sign in, queue a job)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The oldest Python with the oldest redis-py we allow, and the newest of both.
    # The 3.12 run also measures coverage and fails below the floor.
    name: Tests (Python ${{ matrix.python }}, redis-py ${{ matrix.redis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", redis: "5.0.8" }
          - { python: "3.12", redis: "6.4.0", coverage: true }
          - { python: "3.13", redis: "latest" }
          - { python: "3.14", redis: "latest" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Redis (for the tests that need a real server)
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server && sudo systemctl stop redis-server || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ matrix.redis }}" != "latest" ]; then pip install "redis==${{ matrix.redis }}"; fi
          python -c "import redis; print('redis-py', redis.__version__)"

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: python -m pytest -q

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=84

  other-os:
    # The suite without a real Redis server (those tests skip). Windows is supported for development;
    # macOS is checked but not yet claimed, so its result doesn't fail the build.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, experimental: false }
          - { os: macos-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m pytest -q

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: mypy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      # E9: syntax errors · F63: broken comparisons · F7: misplaced statements
      # F82: undefined names. These are bugs, so they fail the build.
      - name: Check for bugs
        run: ruff check --select E9,F63,F7,F82 --output-format=github pytaskq tests

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Committed bundle is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain pytaskq/static)" ]; then
            echo "::error::pytaskq/static is out of date. Run 'cd frontend && npm run build' and commit the result."
            git status --short pytaskq/static
            exit 1
          fi

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/pytaskq --help
          /tmp/clean/bin/python -c "import pathlib, pytaskq; p = pathlib.Path(pytaskq.__file__).parent / 'static' / 'index.html'; assert p.is_file(), 'dashboard missing from wheel'; print('dashboard bundled, version', pytaskq.__version__)"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pytaskq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it end to end
        run: bash scripts/smoke-test-image.sh pytaskq:ci

# Publishes PyTaskQ to PyPI and the Docker image to GHCR when you push a version tag:
#
#   1. bump __version__ in pytaskq/__init__.py and commit
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# Uses PyPI Trusted Publishing (OIDC) and the built-in GITHUB_TOKEN for GHCR,
# so no secret is stored anywhere.
# One-time setup: add this repository as a Trusted Publisher on pypi.org
# (workflow release.yml, environment pypi).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('pytaskq/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pytaskq.__version__ ($VERSION). Bump the version first."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard into the package
        working-directory: frontend
        run: npm ci && npm run build
      - run: test -f pytaskq/static/index.html

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytaskq
    permissions:
      id-token: write   # lets PyPI verify this workflow (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/pytaskq
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4     # lets one machine build for ARM too
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (0.3.1, 0.3, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pytaskq
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=PyTaskQ
            org.opencontainers.image.description=Background jobs for Python with a live dashboard

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: [publish, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4          # for docs/release-notes/
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with notes and files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "PyTaskQ $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "PyTaskQ $GITHUB_REF_NAME" --generate-notes
          fi

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    # Reason: Without a health check, Docker marks Redis as "ready" the instant
    # the process starts — before it can actually accept connections.
    # The web/worker services then crash on startup trying to connect to Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Reason: Prevent logs from filling up disk on a long-running server.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.4"      # Redis is fast; cap at 0.4 cores
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
    environment:
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=5000 # Keep only last 5000 traces, limits RAM usage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"      # Jaeger is observability-only; minimal CPU
          memory: 256M

  web:
    build:
      context: .
      dockerfile: DockerFIle
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    # Reason: `depends_on` by default only waits for the container to START,
    # not for Redis to be READY to accept connections. `condition: service_healthy`
    # uses our health check above to wait until Redis responds to PING.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.9"      # Web API gets nearly 1 full core for handling requests
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: DockerFIle
    command: python -u -m src.worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      redis:
        condition: service_healthy
    # Reason: If the worker crashes (OOM from a bad task, unhandled exception, etc.)
    # it will automatically restart instead of silently dying.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.8"      # Worker gets 0.8 cores for task execution
          memory: 768M     # Extra RAM for CPU-heavy tasks like matrix_multiply
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
